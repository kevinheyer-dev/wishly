{% extends "base.html" %}
{% block title %}Löschen{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>„{{ object }}“ löschen?</h1>
  {% if warning %}<p class="muted">{{ warning }}</p>{% endif %}
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn danger">Endgültig löschen</button>
    <a class="btn" href="{{ cancel_url }}">Abbrechen</a>
  </form>
</section>
{% endblock %}
