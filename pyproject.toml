[project]
name = "wishly"
version = "0.1.0"
description = "Wunschlisten für Familien und Freundeskreise"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "celery[redis]>=5.5",
    "django>=5.2,<6",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
